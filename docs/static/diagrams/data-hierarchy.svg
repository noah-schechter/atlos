<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="Atlos data hierarchy: a project contains incidents, which contain source material, which contain artifacts" fill="none" stroke="currentColor" stroke-width="2" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <title>Atlos data hierarchy</title>
  <desc>Four nested rounded rectangles showing that a Project contains Incidents, each Incident contains Source material, and each piece of Source material contains Artifacts (files). Each containment level is annotated with "× many" to indicate a one-to-many relationship.</desc>

  <rect x="20" y="20" width="680" height="320" rx="12" ry="12"/>
  <text x="32" y="40" fill="currentColor" stroke="none">Project</text>

  <rect x="60" y="60" width="620" height="260" rx="10" ry="10"/>
  <text x="72" y="80" fill="currentColor" stroke="none">Incident</text>
  <text x="678" y="54" fill="currentColor" stroke="none" text-anchor="end" font-style="italic" font-size="12">× many</text>

  <rect x="100" y="100" width="540" height="200" rx="8" ry="8"/>
  <text x="112" y="120" fill="currentColor" stroke="none">Source material</text>
  <text x="638" y="94" fill="currentColor" stroke="none" text-anchor="end" font-style="italic" font-size="12">× many</text>

  <rect x="140" y="140" width="460" height="140" rx="6" ry="6"/>
  <text x="152" y="160" fill="currentColor" stroke="none">Artifact (file)</text>
  <text x="598" y="134" fill="currentColor" stroke="none" text-anchor="end" font-style="italic" font-size="12">× many</text>
</svg>
